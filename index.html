<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PindoCraft</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #faf7f2;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", sans-serif;
    color: #5a4738;
  }
  .card {
    text-align: center;
    padding: 48px 40px;
    border-radius: 16px;
    background: #fffdf8;
    box-shadow: 0 10px 36px rgba(45, 24, 37, 0.14);
  }
  .beads {
    display: grid;
    grid-template-columns: repeat(6, 14px);
    gap: 6px;
    justify-content: center;
    margin-bottom: 28px;
  }
  .beads i { width: 14px; height: 14px; border-radius: 50%; }
  h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 10px; }
  p { font-size: 14px; color: #a08c7a; }
</style>
</head>
<body>
<div class="card">
  <div class="beads" aria-hidden="true">
    <i style="background:#FD543D"></i><i style="background:#FEBF45"></i><i style="background:#35C75B"></i><i style="background:#01ACEB"></i><i style="background:#8B5CF6"></i><i style="background:#F13D74"></i>
    <i style="background:#F13D74"></i><i style="background:#FD543D"></i><i style="background:#FEBF45"></i><i style="background:#35C75B"></i><i style="background:#01ACEB"></i><i style="background:#8B5CF6"></i>
    <i style="background:#8B5CF6"></i><i style="background:#F13D74"></i><i style="background:#FD543D"></i><i style="background:#FEBF45"></i><i style="background:#35C75B"></i><i style="background:#01ACEB"></i>
  </div>
  <h1>PindoCraft</h1>
  <p>🧩 Coming Soon</p>
</div>
</body>
</html>
